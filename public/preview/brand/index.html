<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>[検品プレビュー] 公式アイコン ＆ 公式OGPアイキャッチ提案</title>
  <style>
    body {
      margin: 0;
      padding: 24px 16px 60px;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
    }
    .wrap {
      max-width: 1120px;
      margin: 0 auto;
    }
    .notice {
      background: rgba(200, 150, 62, 0.14);
      border: 1px solid rgba(229, 193, 122, 0.4);
      color: #e5c17a;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 20px;
    }
    h1 { font-size: 20px; margin: 0 0 16px; }
    h2 { font-size: 16px; margin: 32px 0 12px; color: #e5c17a; }
    img {
      width: 100%;
      height: auto;
      border-radius: 10px;
      display: block;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }
    .ogp-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }
    .card-label {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #cbd5e1;
    }
    @media (max-width: 768px) {
      .ogp-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="notice">【オーナー検品専用（noindex）】公式アイコン3案 ＆ 公式OGPアイキャッチ2案 比較プレビュー</div>
    <h1>1. 全体比較ボード（実寸タブ検証 ＆ D.F.ファミリー横並びチェック）</h1>
    <img src="./blog_brand_proposals_board.png" alt="提案比較ボード" />

    <h2>2. 公式OGP（1200×630）単体拡大チェック</h2>
    <div class="ogp-row">
      <div>
        <div class="card-label">【本命：OGP案1】Blueprint Dark × PEN Monolith</div>
        <img src="./blog_ogp_plan_1_blueprint.png" alt="OGP案1" />
      </div>
      <div>
        <div class="card-label">【OGP案2】Architect Paper Light</div>
        <img src="./blog_ogp_plan_2_light.png" alt="OGP案2" />
      </div>
    </div>
  </div>
</body>
</html>
