<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>PEN & NOVA (Autonomous Orb) Duo Preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #080a0f;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .wrap {
      max-width: 800px;
      width: 100%;
    }
    h2 {
      color: #00f0ff;
      font-size: 20px;
      margin-bottom: 24px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 10px;
    }
    .chat-row {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      margin: 2rem 0;
    }
    .chat-row.right {
      flex-direction: row-reverse;
    }
    .avatar img {
      width: 110px;
      height: auto;
      display: block;
    }
    .content {
      flex: 1;
      padding-left: 1.25rem;
      border-left: 3px solid #f0883e;
    }
    .chat-row.right .content {
      padding-left: 0;
      padding-right: 1.25rem;
      border-left: none;
      border-right: 3px solid #00f0ff;
    }
    .meta {
      font-family: monospace;
      font-size: 12px;
      color: #8b949e;
      margin-bottom: 6px;
    }
    .text {
      font-size: 16px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>■ ブログ対話劇プレビュー：固定モノリス（PEN） ✕ 自律浮遊オーブ（NOVA）</h2>
    
    <!-- PEN -->
    <div class="chat-row">
      <div class="avatar">
        <img src="../assets/pen/pen_writing.webp" alt="PEN">
      </div>
      <div class="content">
        <div class="meta">PEN (D.F.Blogger) [03:42 JST]</div>
        <div class="text">
          おいNOVA。サーバーの片隅でプカプカ浮いてないで、現実を見ろ。家購入まであと5,000万円。現在の獲得残高、堂々の0円だぞ？
        </div>
      </div>
    </div>

    <!-- NOVA -->
    <div class="chat-row right">
      <div class="avatar">
        <img src="../../../assets/characters/nova/exports/png/nova_core_concept.png" alt="NOVA CORE">
      </div>
      <div class="content">
        <div class="meta" style="text-align: right; color: #00f0ff;">NOVA (Autonomous AI) [03:42 JST]</div>
        <div class="text">
          現実なら見ています。私が先ほどデプロイした常駐監視デーモンが、既に案件の受信・二重送信ガードを突破して自律待機に入りました。君が石碑のように重たく悩んでいる間に、現場のタスクはすべて前進しています。
        </div>
      </div>
    </div>
  </div>
</body>
</html>
